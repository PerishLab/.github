name: Guard

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  actions: read

jobs:
  guard:
    name: Guard
    if: github.repository != 'PerishLab/.github'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/perishlab/images:stable
    steps:
      - name: Check out exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install Guard controls
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          install_control() {
            product=$1
            prefix=$2
            manager="$RUNNER_TEMP/manage-$product.sh"
            curl -fsSL "https://releases.$product.perish.uk/manage.sh" -o "$manager"
            env \
              "${prefix}_CHANNEL=stable" \
              "${prefix}_VERSION=" \
              sh "$manager" install
          }
          install_control plumb PLUMB
          install_control ectropy ECTROPY
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Grant GitHub Packages reads
        if: hashFiles('package.json') != ''
        env:
          TOKEN: ${{ secrets.PERISHLAB_PACKAGES_READ }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PERISHLAB_PACKAGES_READ is not available to this repository"
            exit 1
          fi
          umask 077
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$TOKEN" > "$RUNNER_TEMP/npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"

      - name: Declare Guard material transport
        id: material
        if: hashFiles('Cargo.lock') != ''
        continue-on-error: true
        env:
          PLUMB_GUARD_CONTAINER: ${{ job.container.id }}
        run: |
          plumb cache transport --json > "$RUNNER_TEMP/guard-material.json"
          jq -r '"paths<<PLUMB_PATHS\n\(.paths | join("\n"))\nPLUMB_PATHS\nartifact=\(.artifact)"' "$RUNNER_TEMP/guard-material.json" >> "$GITHUB_OUTPUT"

      - name: Import Guard compilation material
        if: steps.material.outputs.paths != ''
        continue-on-error: true
        env:
          PLUMB_GUARD_CONTAINER: ${{ job.container.id }}
          GH_TOKEN: ${{ github.token }}
        run: plumb cache transport --restore --fetch --json

      - name: Guard
        env:
          PLUMB_GUARD_CONTAINER: ${{ job.container.id }}
          PLUMB_GUARD_BOUNDARY: head
          PLUMB_GUARD_COMPILER_CACHE: sccache
          PLUMB_GUARD_STRENGTH: full
        run: |
          status=0
          plumb guard --json > "$RUNNER_TEMP/guard-runtime.json" || status=$?
          cat "$RUNNER_TEMP/guard-runtime.json"
          exit "$status"

      - name: Publish Guard runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guard-runtime
          path: ${{ runner.temp }}/guard-runtime.json
          if-no-files-found: error

      - name: Seal Guard material parcel
        id: seal
        if: steps.material.outputs.paths != ''
        continue-on-error: true
        env:
          PLUMB_GUARD_CONTAINER: ${{ job.container.id }}
        run: |
          plumb cache transport --save --json > "$RUNNER_TEMP/guard-material-saved.json"
          jq -r '"populated=\(.populated)"' "$RUNNER_TEMP/guard-material-saved.json" >> "$GITHUB_OUTPUT"

      - name: Publish accepted-tree material candidate
        if: steps.seal.outputs.populated == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.material.outputs.artifact }}
          path: ${{ steps.material.outputs.paths }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
