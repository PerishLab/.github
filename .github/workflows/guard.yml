name: Guard

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  guard:
    name: Guard
    if: github.repository != 'PerishLab/.github'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Prepare declared Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install Plumb v0.63.0
        uses: PerishLab/actions/setup-binary@7810d7b6f78cdde42e9d7026666e1aafb157255d
        env:
          PERISH_SETUP_CHANNEL: stable
          PERISH_SETUP_PRODUCT: plumb
          PERISH_SETUP_VERSION: v0.63.0

      - name: Install Ectropy v0.10.0
        uses: PerishLab/actions/setup-binary@7810d7b6f78cdde42e9d7026666e1aafb157255d
        env:
          PERISH_SETUP_CHANNEL: stable
          PERISH_SETUP_PRODUCT: ectropy
          PERISH_SETUP_VERSION: v0.10.0

      - name: Read declared Node toolchain
        id: node
        run: |
          node=""
          pnpm=""
          if [ -f package.json ]; then
            node=$(jq -r '.engines.node // empty' package.json)
            pnpm=$(jq -r '.engines.pnpm // empty' package.json)
            if [ -z "$pnpm" ]; then
              manager=$(jq -r '.packageManager // empty' package.json)
              case "$manager" in
                pnpm@*) pnpm=${manager#pnpm@}; pnpm=${pnpm%%+*} ;;
              esac
            fi
          fi
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "pnpm=$pnpm" >> "$GITHUB_OUTPUT"

      - name: Install declared Node
        if: steps.node.outputs.node != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.node.outputs.node }}

      - name: Install declared pnpm
        if: steps.node.outputs.pnpm != ''
        env:
          PNPM_VERSION: ${{ steps.node.outputs.pnpm }}
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pnpm" "pnpm@${PNPM_VERSION}"
          echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"

      - name: Grant GitHub Packages reads
        if: steps.node.outputs.pnpm != ''
        env:
          TOKEN: ${{ secrets.PERISHLAB_PACKAGES_READ }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PERISHLAB_PACKAGES_READ is not available to this repository"
            exit 1
          fi
          umask 077
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$TOKEN" > "$RUNNER_TEMP/npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"

      - name: Guard
        env:
          PLUMB_GUARD_BOUNDARY: head
          PLUMB_GUARD_STRENGTH: full
        run: plumb guard
