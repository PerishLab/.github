name: Guard

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  guard:
    name: Guard
    if: github.repository != 'PerishLab/.github'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/perishlab/images@sha256:35d8fa77f3596fc405bf0e931d71cf41d1c43b4444741f870083ec9c4613aaa7
    steps:
      - name: Check out exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install Plumb stable
        uses: PerishLab/actions/setup-binary@7810d7b6f78cdde42e9d7026666e1aafb157255d
        env:
          PERISH_SETUP_CHANNEL: stable
          PERISH_SETUP_PRODUCT: plumb

      - name: Install Ectropy stable
        uses: PerishLab/actions/setup-binary@7810d7b6f78cdde42e9d7026666e1aafb157255d
        env:
          PERISH_SETUP_CHANNEL: stable
          PERISH_SETUP_PRODUCT: ectropy

      - name: Grant GitHub Packages reads
        if: hashFiles('package.json') != ''
        env:
          TOKEN: ${{ secrets.PERISHLAB_PACKAGES_READ }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PERISHLAB_PACKAGES_READ is not available to this repository"
            exit 1
          fi
          umask 077
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$TOKEN" > "$RUNNER_TEMP/npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"

      - name: Guard
        env:
          PLUMB_GUARD_BOUNDARY: head
          PLUMB_GUARD_STRENGTH: full
        run: plumb guard
