name: Bug
description: Report behavior that contradicts an existing contract.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Describe one reproducible product contradiction. Separate unrelated symptoms into their own issues.
        Read https://github.com/PerishLab/.github/blob/main/GOVERNANCE.md at work start and before delivery or closure.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What was directly observed, and which existing contract does it contradict? Separate inferred causes and unresolved diagnosis.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Give the smallest reproduction, exact refusal and execution/consumer identity. Mark manual review, machine verification and unsupported inference honestly.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What observable behavior should replace the defect?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Name the source/release endpoint, exact evidence and obligations after merge. For adopted acceptance, include current declaration-linked comment closure; a stable consumer needs inclusion/distribution and any promised installed-behavior evidence.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: State adjacent repairs or redesigns that are outside this issue.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        After creation, use GitHub Relationships for parent, sub-issue, blocked-by, and blocking edges. Do not encode those relationships as labels.
        Adopt acceptance:source or acceptance:release through Concord when work resumes. Keep the target label after closure; record declarations, reasoned amendments and final judgments in Concord comments, not a separate ledger.
