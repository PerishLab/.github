name: Bug
description: Report behavior that contradicts an existing contract.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Describe one reproducible product contradiction. Separate unrelated symptoms into their own issues.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and which existing contract does it contradict?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Give the smallest reproduction, exact refusal, or other direct evidence.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What observable behavior should replace the defect?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: List every condition required to close the issue, including any post-merge or stable-release evidence.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: State adjacent repairs or redesigns that are outside this issue.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        After creation, use GitHub Relationships for parent, sub-issue, blocked-by, and blocking edges. Do not encode those relationships as labels.
